# Thin caller: the actual gate lives in verify.yml (one definition, shared with
# the publish workflow) so push CI and the publish gate cannot drift. The
# Windows and coverage legs run on a schedule instead (nightly.yml) — neither
# gates anything, and together they tripled this workflow's wall clock.
name: CI

on:
  push:
    branches: [main]
    # Docs/website-only pushes can't affect the gate. Deliberately NOT a
    # blanket `**.md` ignore: crates/sema-docs/entries/*.md are inputs to the
    # `jake docs-check` gate and must keep triggering.
    paths-ignore:
      - "docs/**"
      - "website/**"
      - "CHANGELOG.md"
      - "README.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "website/**"
      - "CHANGELOG.md"
      - "README.md"

# Superseded pushes stop burning runners. Scoped to this workflow only — the
# publish workflow's verify call runs inside its own run and must never be
# cancelled mid-publish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml
