# TEMPORARY iteration harness for the Windows test-porting work (the nightly
# windows leg's fix waves). PR-triggered because schedule/workflow_dispatch
# only function from the default branch, and there is no Windows machine in
# the dev loop — each push to a fix/windows* PR gets a full suite run here.
# DELETE this file when the leg is green and moves back into the per-push
# gate (see the plan in nightly.yml's header).
name: windows tests (iteration)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: win-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-windows:
    # Only on the Windows-porting branches — this harness is not a general PR gate.
    if: startsWith(github.head_ref, 'fix/windows')
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # The unified-runtime conformance tests scan with `rg`.
      - name: Install ripgrep
        run: choco install ripgrep -y --no-progress

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run tests
        run: cargo nextest run --workspace --profile ci-windows

      # Diagnostic for bug 1 (docs/bugs/2026-07-29-windows-product-bugs.md):
      # the failing tests embed into the DEBUG test binary as carrier; end
      # users' `sema build` embeds into the installed RELEASE binary. Probe
      # both carriers to tell a product bug from a test-environment artifact.
      - name: Probe embedded-payload carriers
        if: always()
        shell: bash
        run: |
          set -x
          pip install pefile
          cat > dumpres.py <<'PY'
          import sys, pefile
          pe = pefile.PE(sys.argv[1])
          for t in pe.DIRECTORY_ENTRY_RESOURCE.entries:
              tname = str(t.name) if t.name else pefile.RESOURCE_TYPE.get(t.id, t.id)
              names = [str(e.name) if e.name else str(e.id) for e in t.directory.entries]
              print("RES", tname, names)
          PY
          printf '(display "carrier-ok")' > probe.sema
          # Carrier 1: the debug test binary (what the failing tests use).
          cargo run -p sema-lang -- build -o probe-debug.exe probe.sema || true
          ./probe-debug.exe < /dev/null || true
          python dumpres.py probe-debug.exe || true
          # Carrier 2: the released v1.31.5 sema.exe (what end users get) —
          # --target windows on a Windows host short-circuits to "this
          # executable", so force the release carrier via --runtime.
          curl -sL -o rel.zip https://github.com/sema-lisp/sema/releases/download/v1.31.5/sema-lang-x86_64-pc-windows-msvc.zip
          unzip -o -q rel.zip -d rel
          RT=$(find rel -name 'sema.exe' | head -1)
          cargo run -p sema-lang -- build --runtime "$RT" -o probe-rel.exe probe.sema || true
          ./probe-rel.exe < /dev/null || true
          python dumpres.py probe-rel.exe || true
          # Does the WIN32 API (what try_run_embedded uses via FindResource)
          # see the resource that pefile's linear parse sees? Distinguishes a
          # directory that is structurally present but malformed for the
          # loader's sorted walk.
          cat > apiprobe.py <<'PY'
          import ctypes, sys
          from ctypes import wintypes
          k32 = ctypes.WinDLL('kernel32', use_last_error=True)
          k32.LoadLibraryExW.restype = wintypes.HMODULE
          k32.LoadLibraryExW.argtypes = [wintypes.LPCWSTR, wintypes.HANDLE, wintypes.DWORD]
          k32.FindResourceW.restype = ctypes.c_void_p
          k32.FindResourceW.argtypes = [wintypes.HMODULE, wintypes.LPCWSTR, wintypes.LPCWSTR]
          for flags in (0x2, 0x22):  # DATAFILE, DATAFILE|IMAGE_RESOURCE
              h = k32.LoadLibraryExW(sys.argv[1], None, flags)
              print('flags', hex(flags), 'mod', h, 'err', ctypes.get_last_error())
              if not h: continue
              r = k32.FindResourceW(h, 'SEMAEXEC', ctypes.cast(ctypes.c_void_p(10), wintypes.LPCWSTR))
              print('  FindResourceW SEMAEXEC ->', r, 'err', ctypes.get_last_error())
          PY
          python apiprobe.py probe-debug.exe || true
          python apiprobe.py probe-rel.exe || true
