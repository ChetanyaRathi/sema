# Legs that don't belong on the per-push critical path:
#
#  - test-windows: DELIBERATELY nightly, not per-push (decision 2026-07-29,
#    made when the leg first went fully green after the test-porting wave).
#    Per-push it would cost ~12 Windows runner-minutes on every push; nightly
#    means a Windows regression surfaces next-day, which is the accepted
#    trade for fast pushes. Revisit only if a Windows regression actually
#    ships — the leg is green and a red nightly is the honest signal.
#  - coverage: instrumented re-run of the suite under plain `cargo test`; known
#    to flake after the real gate already passed (2046c907). Metrics must not
#    extend or redden the gating path, so they ride the schedule instead.
#  - docs-search-gate: hermetic embedded-asset gate (FROM-scratch container,
#    --network none) proving the MCP docs_search corpus+index are baked into
#    the binary — the same works-from-checkout/broken-installed class as the
#    packaged-web smoke. Nightly because its docker build compiles a musl
#    release binary from cold (~20m) — too heavy per-push, cheap once a day.
#  - grammar-fuzz: the in-Sema grammar fuzzer (deterministic sweep + async
#    watchdog/value/twin batches) and the Rust shutdown-leak harness. Nightly
#    because its value is fresh random seeds each night, not per-diff
#    regression, and it needs both a release build (the fuzzer binary) and a
#    debug test build (the harness) — ~20 runner-minutes per-push would buy
#    nothing a nightly rotation doesn't.
name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A red job here is the honest signal that the Windows port still has debt —
  # it blocks nothing. No continue-on-error: hiding the failure is how the old
  # leg stayed red for 37 straight runs without anyone acting on it.
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # The unified-runtime conformance tests drive
      # scripts/check-unified-runtime-*.sh, which scan with `rg`. The old
      # per-push leg never installed it, so those tests could never pass.
      - name: Install ripgrep
        run: choco install ripgrep -y --no-progress

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # cache-on-failure: while the leg is red, the default (save only on
      # success) means no cache is ever written and every run recompiles the
      # workspace cold (~6 minutes).
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # ci-windows profile (.config/nextest.toml): retries=0 (retrying hung
      # tests doubled a ~36-minute timeout tail) and the Unix-only pty suites
      # filtered out via default-filter.
      - name: Run tests
        run: cargo nextest run --workspace --profile ci-windows

  docs-search-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Hermetic embedded docs_search gate
        run: ./scripts/docs-search-gate.sh

  # Randomized long-run testing of the compiler/VM and the async runtime.
  # The seed base rotates with the run id so each night covers fresh seeds,
  # and every tool logs its base (the scripts print seed/count/depth at
  # startup; the harness prints its seed/count/depth line to stderr), so any
  # red night reproduces from the logged numbers. No continue-on-error: a red
  # job is the signal, same policy as test-windows.
  #
  # Budget (measured 2026-07-30 on an M-series dev machine, DEBUG binary —
  # the release binary CI runs is faster per program, the CI runner ~2-3x
  # slower per core; the two roughly cancel): sync 20000 seeds 46s; async
  # depth 5 n=1000 11s, depth 6 n=1000 17s (~1s/100-seed batch of that is
  # watchdog poll granularity); harness ~35ms/seed. At the sizes below the
  # fuzz steps cost ~5-6 CI minutes; the release build (~4-5m), the debug
  # test build for the harness (~6-8m), and setup dominate the job.
  grammar-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Rotating but reproducible: unique per run, printed by every step's
      # tool, and recorded in the job summary.
      FUZZ_SEED_BASE: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up toolchain, cache, jake
        uses: ./.github/actions/setup-sema

      # The fuzzer runs the release binary: release is panic=abort, so a VM
      # panic is a hard crash the driver classifies via the seed breadcrumb.
      - name: Build release binary
        run: cargo build --release -p sema-lang

      - name: Deterministic sweep (sync grammar, round-trip + value + laws)
        run: ./scripts/grammar-fuzz.sh check -n 20000 -s "$FUZZ_SEED_BASE"

      # The async batches run under the driver's external watchdog (exit 3 on
      # hang) with the generation-time value oracle, the embedded #t laws, and
      # the sequential-twin oracle all active.
      - name: Async batch, depth 5
        shell: bash
        run: ./scripts/grammar-fuzz.sh check --async -n 5000 -d 5 -s "$FUZZ_SEED_BASE" | tee async-d5.log

      # Depth 6 is where both instances of the state-dependent invariant
      # fault lived (docs/bugs/async-fuzz-findings.md finding 3); depth-4
      # batches of thousands of seeds never hit it.
      - name: Async batch, depth 6
        shell: bash
        run: ./scripts/grammar-fuzz.sh check --async -n 5000 -d 6 -s "$FUZZ_SEED_BASE" | tee async-d6.log

      # The per-batch twin-oracle stat lines prove the twin oracle ran instead
      # of passing vacuously (checked= would be 0 across the board).
      - name: Twin-oracle stats into the job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### grammar-fuzz nightly"
            echo ""
            echo "Seed base: \`$FUZZ_SEED_BASE\` — reproduce any step with \`-s $FUZZ_SEED_BASE\` and its \`-n\`/\`-d\` (harness: \`SEMA_FUZZ_SEED=$FUZZ_SEED_BASE\`)."
            for f in async-d5.log async-d6.log; do
              [ -f "$f" ] || continue
              echo ""
              echo "#### ${f%.log}"
              echo '```'
              grep -h "^twin-oracle:" "$f" || echo "(no twin-oracle lines — batch died before finishing)"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Rust-side oracle the .sema fuzzer cannot reach: zero live tasks and a
      # clean ShutdownReport after every generated program, on both the
      # default drive path and the selection-scoped drive_roots pair mode.
      # Builds the debug test profile (separate from the release build above;
      # both are per-run costs — see the cache note in setup-sema).
      - name: Shutdown-leak harness (500 seeds, depth 5)
        run: SEMA_FUZZ_SEED="$FUZZ_SEED_BASE" SEMA_FUZZ_COUNT=500 SEMA_FUZZ_DEPTH=5 cargo nextest run -p sema-lang --test fuzz_async_shutdown_test --run-ignored ignored-only

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Set up toolchain, cache, jake
        uses: ./.github/actions/setup-sema

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # Advisory: instrumentation re-runs the suite through plain `cargo test`
      # (no nextest retries), so a timing-sensitive test can flake here after
      # the real gate already passed. Metrics must not paint the run red.
      - name: Generate coverage
        continue-on-error: true
        run: jake release.coverage

      - name: Upload coverage reports to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
