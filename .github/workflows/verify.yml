# Reusable verification gate — the same correctness checks CI runs, callable from
# the publish workflows so a release can NEVER ship when tests are red.
# (CI runs on branch pushes; the tag-triggered publishes call this to gate.)
name: Verify

on:
  workflow_call:
  # Run the gate on demand, without cutting a release. `workflow_call` alone
  # means this only ever executes on a tag push, so a break in it stays
  # invisible until someone tries to publish — which is exactly what happened:
  # the packaged-crate check landed 2026-07-10 and its failure was not seen
  # until the next release, 16 days later, by which point it had also hidden a
  # genuine packaging bug behind it. Exercise this before tagging.
  workflow_dispatch:

jobs:
  playground-runtime:
    permissions:
      contents: read
    uses: ./.github/workflows/playground-runtime.yml

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config ripgrep

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Smart Rust cache: derives its key from the toolchain + Cargo.lock and
      # partial-restores on changes (vs. the old exact-match key that cold-rebuilt
      # the whole workspace whenever Cargo.lock moved — i.e. every release).
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: Install jake
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/HelgeSverre/jake/releases/latest/download/jake-linux-x86_64 -o "$HOME/.local/bin/jake"
          chmod +x "$HOME/.local/bin/jake"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify jake
        run: jake --version

      # Gate the publish on a complete crate list: every publishable workspace
      # crate must be in publish.yml's order, so a release can't half-publish on a
      # newly-added crate (as happened with sema-otel in 1.22.0).
      - name: Check publish list is complete
        run: ./scripts/check-publish-list.sh

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      # Before docs-check: `jake docs-check` runs the LSP builtin-doc-coverage
      # test through cargo nextest.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Check builtin docs
        run: jake docs-check

      - name: Run tests
        run: cargo nextest run --workspace --profile ci

      - name: Smoke test packaged web runtime
        run: ./scripts/test-packaged-sema-web.sh

      - name: Smoke test examples
        run: jake examples

      - name: Smoke test bytecode
        run: jake smoke-bytecode

  # Fail if the committed `sema web` browser runtime is stale, so an out-of-date
  # runtime can NEVER be published. The runtime under crates/sema/src/web/assets
  # is a checked-in generated artifact.
  #
  # This does NOT rebuild and compare bytes. It cannot: rustc derives each
  # crate's disambiguator from host-dependent inputs, so the same source yields
  # different bytes on macOS-arm64 and this Linux runner even after every
  # absolute path is remapped out of the build (measured: 234 bytes and 16 glue
  # lines still differed). That gate was unsatisfiable for any contributor and
  # sat red for 16 days, hiding two real bugs behind it. Instead the vendoring
  # step records a fingerprint of the runtime's INPUTS, and this compares it —
  # host-independent, catches VM-internal changes an API-surface check would
  # miss, and needs no toolchain. See scripts/check-web-runtime-fresh.sh.
  #
  # That the wasm still BUILDS on Linux is covered by the playground-runtime job
  # above, which compiles it. In-browser behavior is covered by
  # sema-web-tests.yml (Playwright).
  web-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fail if the committed runtime is stale
        run: ./scripts/check-web-runtime-fresh.sh
