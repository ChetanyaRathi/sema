# The single verification gate — every correctness check that must pass before
# code ships. ci.yml calls this on every push/PR and the publish workflow calls
# it on tags, so push CI and the publish gate are one definition and cannot
# drift (the old duplicated ci.yml/verify.yml bodies drifted destructively
# twice: nextest-installed-after-docs-check broke every push for weeks, and a
# missing ripgrep silently failed the conformance tests).
name: Verify

on:
  workflow_call:
  # Run the gate on demand, without cutting a release. Historically this only
  # executed on tag pushes, so a break in it stayed invisible until someone
  # tried to publish — which is exactly what happened: the packaged-crate check
  # landed 2026-07-10 and its failure was not seen until the next release, 16
  # days later, by which point it had also hidden a genuine packaging bug
  # behind it. ci.yml calling this per-push closes that hole; the dispatch
  # trigger stays as the on-demand path.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Proves the WASM runtime still builds (and passes its focused browser
  # regressions) — the "broken WASM build must never reach a release" gate.
  playground-runtime:
    permissions:
      contents: read
    uses: ./.github/workflows/playground-runtime.yml

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # ripgrep: the unified-runtime conformance tests scan with `rg`.
      # shfmt: `jake scripts.check`.
      - name: Set up toolchain, cache, jake
        uses: ./.github/actions/setup-sema
        with:
          components: rustfmt, clippy
          apt-packages: libudev-dev pkg-config ripgrep shfmt

      # Gate the publish on a complete crate list: every publishable workspace
      # crate must be in the publish order, so a release can't half-publish on
      # a newly-added crate (as happened with sema-otel in 1.22.0).
      - name: Check publish list is complete
        run: jake release.check-publish-list

      - name: Lint (fmt-check + clippy --workspace)
        run: jake lint

      - name: Shell-script hygiene (shellcheck + shfmt)
        run: jake scripts.check

      - name: Check builtin docs (committed index fresh + fully documented)
        run: jake docs-check

      - name: Run tests
        run: jake test.ci

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # LSP protocol-level e2e suite (pytest-lsp over stdio): initialize
      # handshake, capabilities, diagnostics push, UTF-16 positions — coverage
      # the in-crate tests cannot see. Reuses the debug binary the test build
      # above already produced (the cargo build inside is an incremental no-op).
      - name: LSP e2e suite (pytest)
        run: jake test.lsp-e2e

      - name: Smoke test bytecode
        run: jake smoke-bytecode

      - name: Smoke test packaged web runtime
        run: jake release.packaged-web

  # Runs every example against the RELEASE binary — the gate's only native
  # release-profile execution (release-only bug classes exist: a debug_assert
  # side-effect compiled out of release once shipped a broken browser VM), and
  # skipping the examples run at all is how a regression once shipped past four
  # releases. Its own job because the ~4-minute release rebuild of the
  # workspace crates is unavoidable per run (fresh-checkout mtimes invalidate
  # cargo's fingerprints for workspace members, so caching cannot absorb it) —
  # in here it runs parallel to the test suite instead of extending it.
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up toolchain, cache, jake
        uses: ./.github/actions/setup-sema
        with:
          install-nextest: "false"

      - name: Smoke test examples
        run: jake examples

  # Fail if the committed `sema web` browser runtime is stale, so an out-of-date
  # runtime can NEVER be published. The runtime under crates/sema/src/web/assets
  # is a checked-in generated artifact.
  #
  # This does NOT rebuild and compare bytes. It cannot: rustc derives each
  # crate's disambiguator from host-dependent inputs, so the same source yields
  # different bytes on macOS-arm64 and this Linux runner even after every
  # absolute path is remapped out of the build (measured: 234 bytes and 16 glue
  # lines still differed). That gate was unsatisfiable for any contributor and
  # sat red for 16 days, hiding two real bugs behind it. Instead the vendoring
  # step records a fingerprint of the runtime's INPUTS, and this compares it —
  # host-independent, catches VM-internal changes an API-surface check would
  # miss, and needs no toolchain. See scripts/check-web-runtime-fresh.sh.
  #
  # That the wasm still BUILDS on Linux is covered by the playground-runtime job
  # above, which compiles it. In-browser behavior is covered by
  # sema-web-tests.yml (Playwright).
  web-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Fail if the committed runtime is stale
        run: ./scripts/check-web-runtime-fresh.sh
